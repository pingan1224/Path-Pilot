# Evaluation gate.
#
# Two tiers, honestly separated:
#
# - `checks` runs on every push: lint, frontend build, the unit tests (planning rule
#   engine and decoder classifier — pure functions, no database or model), and the parts
#   of the eval that need no external service (label integrity, schema compile). Free,
#   fast, always on.
#
# - `eval-gate` runs the full agent evaluation and fails the build if a metric drops
#   below threshold (see GATE in api/scripts/run_eval.py: high-stakes escalation recall
#   >= 0.90, zero leakage, zero readiness mismatches, and the retrieval floors).
#   It needs three secrets — DATABASE_URL, MOONSHOT_API_KEY, OPENAI_API_KEY — plus a
#   database seeded for eval. Because it costs real tokens, it is wired to manual
#   dispatch rather than every push; run it before merging anything that touches
#   app/services/agent*.py, retrieval, or the prompts.

name: eval

on:
  push:
  workflow_dispatch:
    inputs:
      chat_model:
        description: "CHAT_MODEL override (e.g. kimi-k3 to compare models)"
        required: false
        default: ""

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend build + lint
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: API deps
        working-directory: api
        run: pip install -r requirements-dev.txt

      # The rule engine and the decoder classifier are pure functions over frozen
      # dataclasses — no database, no model, no network. That is what makes them
      # affordable on every push, and they are where a wrong planning verdict or a
      # misread error message gets caught.
      - name: Unit tests
        working-directory: api
        run: python -m pytest tests/ -q

      - name: Schema compiles, case labels are well-formed
        working-directory: api
        run: |
          python -m scripts.schema_sql > /dev/null
          python - <<'PY'
          from eval.golden import BEHAVIOR_CASES, RETRIEVAL_CASES, forbidden_tools_for
          from eval.decoder_cases import CASES as DECODER_CASES
          from eval.decoder_cases import validate as validate_decoder

          # Tool-name integrity — that every must_call, every ban, and WRITE_TOOLS still
          # name tools that exist — moved to tests/test_case_labels.py on 2026-08-13, so
          # it runs in the local suite too. It lived only here, and a deletion broke three
          # case labels and this step's own imports without anything saying so until CI ran.
          banned = sum(1 for c in BEHAVIOR_CASES if forbidden_tools_for(c))
          print(f"write tool banned on {banned}/{len(BEHAVIOR_CASES)} behavior cases")

          # A mislabelled decoder case would be reported as a measurement, so the labels
          # are checked for internal consistency before anything is measured against them.
          problems = validate_decoder()
          assert not problems, "invalid decoder labels:\n  " + "\n  ".join(problems)

          print(
              f"golden set OK: {len(RETRIEVAL_CASES)} retrieval + "
              f"{len(BEHAVIOR_CASES)} behavior + {len(DECODER_CASES)} decoder"
          )
          PY

  eval-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.EVAL_DATABASE_URL }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      MOONSHOT_BASE_URL: https://api.moonshot.cn/v1
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install
        working-directory: api
        run: pip install -r requirements.txt
      - name: Model override
        if: inputs.chat_model != ''
        run: echo "CHAT_MODEL=${{ inputs.chat_model }}" >> "$GITHUB_ENV"
      - name: Seed eval database
        working-directory: api
        run: |
          python -m scripts.init_db
          python -m scripts.seed --reset
          python -m scripts.embed_corpus
      # Three attempts per behavior case, at three times the tokens.
      #
      # Every failure this gate has produced was intermittent on re-run — B05, B20, and
      # B35's write-tool call at 2 of 6 — so at one attempt the build result is partly a
      # coin flip, and the usual response to a red build is to re-run it until it is
      # green. That habit is worse than a slow gate: it trains everyone to discard the one
      # signal the gate exists to send. Three attempts also triples the chance of catching
      # a rare leak, since the hard zeros are counted on every attempt.
      - name: Run gated evaluation
        working-directory: api
        run: python -m scripts.run_eval --gate --repeat 3
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: api/eval/results/
