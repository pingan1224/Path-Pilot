# Render blueprint for the API. The web half is Vercel's — see web/vercel.json, whose
# /api/* rewrite has to point at whatever host this service ends up on.
#
# The two are not independent: the session cookie is SameSite=lax, so the browser has to
# see the API on its own origin. Vercel rewriting /api/* here is what produces that, and
# it is the same shape the Vite dev proxy gives locally. Point the frontend straight at
# this host instead and the cookie stops being sent.
# READ THIS BEFORE TRUSTING ANYTHING BELOW.
#
# **This file does not configure the running service.** `path-pilot-api` was created by
# hand in the Render dashboard rather than from a Blueprint, so Render has never read this
# file and does not watch it. Everything here is a description of what the service should
# be; the values Render actually uses live in the dashboard, and the two drift silently
# because nothing compares them.
#
# That drift has now caused two production outages, both of which looked like code bugs:
#
#   * The build command here ran migrations and ingest. The dashboard's ran `pip install`
#     alone, so the deployed database was never migrated and every screen reading a
#     student's own record answered 500.
#   * `CHAT_MODEL` is deliberately absent here (see the note further down) so that the
#     default in `app/config.py` is the only place a model name is written. The dashboard
#     still held `kimi-k2.7-code-highspeed` from the Moonshot era, so every deployed turn
#     asked OpenAI for a model it does not have and 404'd into the degradation path —
#     which is the exact failure the note below describes as already fixed. It was fixed
#     *here*, and here is not where the service reads from.
#
# So: change something in this file and you have changed nothing until you make the same
# change in the dashboard. The lasting fix is to put the service under a Blueprint, which
# means recreating it — new service, re-entered secrets, and `web/vercel.json`'s /api/*
# rewrite repointed at the new host.
services:
  - type: web
    # Matches the deployed service's name. It read `uax-api` while the service was called
    # `path-pilot-api`, which is its own small proof that nothing validates this file.
    name: path-pilot-api
    runtime: python
    plan: free
    region: oregon
    rootDir: api
    # Install, then bring the database up to the code that is about to run against it.
    #
    # This used to be `pip install` alone, and the schema was a manual step recorded in the
    # README. The result was the failure it invites: `scripts.migrate` had never once been
    # run against the deployed database, so it was missing `courses.prerequisite_unparsed`,
    # `requirement_tracks.min_courses`, `requirement_track_required_courses` and
    # `user_preferences`. Every screen that reads a student's own record — plan, mission,
    # sequence, courses — answered 500, while `/health/ready` went on reporting `ok`
    # because it checks that the database answers, not that it has the right shape.
    #
    # The catalogue and requirement rules are here for the same reason. They are reference
    # data derived from the committed `api/data/sections/` snapshot, not user data, so they
    # belong to the code that reads them: the deployed database had 72 courses against the
    # repository's 764, and 8 requirement rows against 79, because that ingest was also
    # only ever run locally. Both are idempotent upserts keyed on the published codes.
    #
    # Failing here fails the deploy, which is the point — the previous arrangement let a
    # deploy succeed onto a database that could not serve it.
    buildCommand: >-
      pip install -r requirements.txt &&
      python -m scripts.migrate &&
      python -m ingest.catalog &&
      python -m ingest.requirements
    # rootDir is api/, so app.main resolves without --app-dir. $PORT is Render's.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Liveness only, despite the name: /health/ready answers 200 even when the database is
    # unreachable, reporting `status: degraded` in the body instead. That is deliberate —
    # the API reports partial capability rather than failing outright — but it means Render
    # cannot use this to catch a wrong DATABASE_URL. Curl it after a deploy and read the
    # body; a green check here does not mean the database is attached.
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"

      # Generated by Render and never seen by anyone. The default in app/config.py is
      # deliberately obvious and must not survive deployment: a predictable signing key
      # means anyone can mint a session for any user.
      - key: SESSION_SECRET
        generateValue: true

      # Served over HTTPS here, so the cookie carries Secure. False locally, where a
      # Secure cookie would not be sent over http and login would not stick.
      - key: SESSION_HTTPS_ONLY
        value: "true"

      # sync: false means Render prompts for these in the dashboard rather than reading
      # them from this file. Secrets do not belong in the repo.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # CHAT_MODEL and EMBEDDING_MODEL are deliberately absent. They used to be pinned
      # here as literal values, which made this file a second source of truth for the
      # model names — and when the chat moved off Moonshot onto OpenAI, app/config.py
      # was updated and this file was not. The stale value won, because a blueprint
      # `value:` beats the code default, so every deployed turn asked OpenAI for a Kimi
      # model and 404'd into the generic degradation path. Leaving them unset means the
      # defaults in app/config.py are the only place a model name is written down.
      #
      # 2026-08-18: removing them from this file did not remove them from the service.
      # `CHAT_MODEL=kimi-k2.7-code-highspeed` was still set in the dashboard and still
      # winning, so the same 404 was live for six days — visible only as the assistant
      # deferring every question with "hit a technical problem", and recorded in
      # `ai_interactions.model` on every one of those turns. An env var set in the
      # dashboard is not unset by deleting it here. Do not override for a comparison
      # either: put it back to unset the moment the comparison is done.

      # Public by design — /demo prints it — but set here so a deployed instance can
      # rotate it without a code change.
      - key: DEMO_PASSWORD
        sync: false

# FAULT_INJECTION is deliberately absent. It defaults to False in app/config.py and
# nothing can be armed while it is off; naming it here, even as "false", would make it
# look like a knob this environment has.
