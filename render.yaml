# Render blueprint for the API. The web half is Vercel's — see web/vercel.json, whose
# /api/* rewrite has to point at whatever host this service ends up on.
#
# The two are not independent: the session cookie is SameSite=lax, so the browser has to
# see the API on its own origin. Vercel rewriting /api/* here is what produces that, and
# it is the same shape the Vite dev proxy gives locally. Point the frontend straight at
# this host instead and the cookie stops being sent.
services:
  - type: web
    name: uax-api
    runtime: python
    plan: free
    region: oregon
    rootDir: api
    buildCommand: pip install -r requirements.txt
    # rootDir is api/, so app.main resolves without --app-dir. $PORT is Render's.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Liveness only, despite the name: /health/ready answers 200 even when the database is
    # unreachable, reporting `status: degraded` in the body instead. That is deliberate —
    # the API reports partial capability rather than failing outright — but it means Render
    # cannot use this to catch a wrong DATABASE_URL. Curl it after a deploy and read the
    # body; a green check here does not mean the database is attached.
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"

      # Generated by Render and never seen by anyone. The default in app/config.py is
      # deliberately obvious and must not survive deployment: a predictable signing key
      # means anyone can mint a session for any user.
      - key: SESSION_SECRET
        generateValue: true

      # Served over HTTPS here, so the cookie carries Secure. False locally, where a
      # Secure cookie would not be sent over http and login would not stick.
      - key: SESSION_HTTPS_ONLY
        value: "true"

      # sync: false means Render prompts for these in the dashboard rather than reading
      # them from this file. Secrets do not belong in the repo.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MOONSHOT_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      - key: MOONSHOT_BASE_URL
        value: https://api.moonshot.cn/v1
      - key: CHAT_MODEL
        value: kimi-k2.7-code-highspeed
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small

      # Public by design — /demo prints it — but set here so a deployed instance can
      # rotate it without a code change.
      - key: DEMO_PASSWORD
        sync: false

# FAULT_INJECTION is deliberately absent. It defaults to False in app/config.py and
# nothing can be armed while it is off; naming it here, even as "false", would make it
# look like a knob this environment has.
